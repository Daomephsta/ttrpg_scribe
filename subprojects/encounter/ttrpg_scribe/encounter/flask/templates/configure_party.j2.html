{% import 'dependencies.j2.html' as dependencies %}
<!DOCTYPE html>
<html>
    <head>
        <title>Configure Party</title>
        <style>
        #centered {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #party {
            display: grid;
            grid-template-columns: 2em auto;
            flex-direction: column;
            width: 33%;
            margin-left: auto;
            margin-right: auto;
        }
        #add-character {
            margin: auto 2px;
        }
        input[type="submit"] {
            grid-column-start: 1;
            grid-column-end: 3;
        }
        </style>
        {{ dependencies.JQUERY }}
        <script type="module" src="{{ url_for('.static', filename='configure_party.js') }}"></script>
    </head>
    <div id="centered">
        <h1>Configure Party</h1>
        <form action="/encounter/party/set" method="post" id="party">
        {% for name in config.PARTY | sort %}
            {% set id = "character-" + (name | slug) %}
            <input type="checkbox" name="{{ name }}" id="{{ id }}" checked>
            <label class="character" for="{{ id }}">{{ name }}</label>
        {% endfor %}
            <input type="button" value="+" id="add-character">
            <input type="text" id="add-character-name">
            <input type="submit" value="Set Party" style="margin-top: 5px;">
        </form>
    </div>
</html>
